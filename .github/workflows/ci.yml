name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_DENY_VERSION: 0.20.2

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Check Bash syntax
        run: find script -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check public repository contract
        run: |
          required_files=(
            LICENSE
            README.md
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            docs/ARCHITECTURE.md
            docs/RELEASING.md
          )
          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing public repository file: $required_file" >&2
              exit 1
            }
          done
          if git grep -nE '/Users/s1kor|mrsikorarafal@gmail\.com|2NY8A789TN' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "Tracked files contain private release-environment identifiers." >&2
            exit 1
          fi
          git diff --check

      - name: Run shell tests
        run: ./script/test_shell.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/SearchIndexCore/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path rust/SearchIndexCore/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path rust/SearchIndexCore/Cargo.toml

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Audit Rust dependencies
        run: cargo audit --file rust/SearchIndexCore/Cargo.lock

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Enforce Rust dependency policy
        run: cargo deny --manifest-path rust/SearchIndexCore/Cargo.toml check

      - name: Build Rust release library
        run: cargo build --manifest-path rust/SearchIndexCore/Cargo.toml --release

      - name: Run full Swift tests
        run: swift test

      - name: Build warning-free Swift release
        run: swift build -c release -Xswiftc -warnings-as-errors
