worker_processes 1;
pid /run/clipvault-relay-proxy/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /var/lib/clipvault-relay-proxy/body;
    proxy_temp_path /var/lib/clipvault-relay-proxy/proxy;
    fastcgi_temp_path /var/lib/clipvault-relay-proxy/fastcgi;
    uwsgi_temp_path /var/lib/clipvault-relay-proxy/uwsgi;
    scgi_temp_path /var/lib/clipvault-relay-proxy/scgi;
    # Tailscale Serve forwards all devices from loopback. Allow bounded bulk
    # traffic without making three paired clients share a 20 request/s ceiling.
    map $uri $clipvault_setup_key {
        default "";
        /v1/joins $binary_remote_addr;
        /v1/workspaces $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr zone=clipvault_requests:1m rate=100r/s;
    limit_req_zone $clipvault_setup_key zone=clipvault_setup:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=clipvault_connections:1m;

    server {
        listen 127.0.0.1:8743;
        client_max_body_size 21m;
        client_body_timeout 30s;
        client_header_timeout 15s;
        keepalive_timeout 20s;
        send_timeout 30s;
        limit_req zone=clipvault_requests burst=50 nodelay;
        limit_req zone=clipvault_setup burst=50 nodelay;
        limit_req_status 429;
        # Four full-size uploads leave room for JSON/ciphertext copies under
        # the relay service's 512 MiB memory ceiling.
        limit_conn clipvault_connections 4;
        limit_conn_status 429;

        location / {
            proxy_pass http://127.0.0.1:8742;
            proxy_http_version 1.1;
            # Ciphertext already has durable storage in the relay. Stream it
            # through the proxy instead of writing each chunk to temp files.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
