[workspace]
resolver = "2"
members = ["core", "relay", "bridge", "linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.23"
libc = "0.2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
